<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier Partagé</title>
<style>
:root {
    --bg: #f1f5f9; --card: #fff; --border: #e2e8f0;
    --text: #1e293b; --muted: #64748b;
    --accent: #6366f1; --accent-dark: #4f46e5;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --shadow-md: 0 4px 12px rgba(0,0,0,.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* Header */
header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow); }
.logo { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

/* Buttons */
.btn { padding: 7px 14px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background .15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }

/* Layout */
.main { max-width: 1080px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start; }
@media (max-width: 720px) { .main { grid-template-columns: 1fr; } }

/* Cards */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card:last-child { margin-bottom: 0; }
.card-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 12px; }

/* Calendar card */
.calendar-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.calendar-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.calendar-nav h2 { font-size: 1rem; font-weight: 600; text-transform: capitalize; }
.nav-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.nav-btn:hover { background: var(--border); }

/* Day headers */
.day-headers { display: grid; grid-template-columns: repeat(7, 1fr); padding: 10px 16px 4px; }
.day-header { text-align: center; font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 4px 0; }

/* Calendar grid */
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 16px 16px; gap: 3px; }
.day-cell { border-radius: 8px; min-height: 58px; padding: 4px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: background .12s; position: relative; }
.day-cell:not(.empty):hover { background: var(--bg); }
.day-cell.empty { cursor: default; }
.day-cell.common-free { background: #dcfce7; }
.day-cell.common-free:hover { background: #bbf7d0; }
.day-number { font-size: 0.82rem; font-weight: 500; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
.day-cell.today .day-number { background: var(--accent); color: #fff; font-weight: 700; }
.day-cell.past .day-number { color: #cbd5e1; }

/* Dots */
.dots-row { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; width: 100%; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.free { background: transparent !important; border: 2px solid; }

/* Legend */
.legend { display: flex; gap: 16px; padding: 10px 4px 2px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: var(--muted); }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.legend-dot.free { background: transparent; border: 2px solid var(--muted); }

/* Sidebar */
.sidebar { display: flex; flex-direction: column; }

/* Profile form */
.form-group { margin-bottom: 12px; }
.form-group:last-child { margin-bottom: 0; }
.form-group label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 5px; color: var(--muted); }
.form-group input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.85rem; background: var(--bg); color: var(--text); transition: border-color .15s, box-shadow .15s; }
.form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }

/* Color grid */
.color-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.color-swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .12s, border-color .12s; }
.color-swatch:hover { transform: scale(1.2); }
.color-swatch.selected { border-color: var(--text); }

/* Participants */
.participant { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 6px; }
.participant:hover { background: var(--bg); }
.participant-color { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.participant-name { flex: 1; font-size: 0.85rem; font-weight: 500; }
.participant-count { font-size: 0.75rem; color: var(--muted); }
.no-participants { font-size: 0.82rem; color: var(--muted); }

/* Day popup */
.day-popup { position: fixed; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow-md); z-index: 100; min-width: 155px; }
.popup-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 2px 6px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.popup-btn { display: block; width: 100%; padding: 7px 10px; border: none; background: none; text-align: left; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background .1s; }
.popup-btn:hover { background: var(--bg); }
.popup-btn.danger { color: #ef4444; }

/* Error banner */
.error-banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius); padding: 10px 16px; font-size: 0.85rem; color: #dc2626; display: flex; align-items: center; gap: 10px; z-index: 200; box-shadow: var(--shadow-md); max-width: 480px; width: calc(100% - 32px); }
.error-close { background: none; border: none; cursor: pointer; color: #dc2626; font-size: 1.1rem; padding: 0; line-height: 1; }

/* Toast */
.toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 0.85rem; box-shadow: var(--shadow-md); z-index: 300; animation: slideUp .25s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* Loading overlay */
.loading-overlay { position: fixed; inset: 0; background: rgba(241,245,249,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 400; font-size: 0.9rem; color: var(--muted); }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Common days button */
.common-days-btn { width: 100%; padding: 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background .15s; margin-top: 8px; }
.common-days-btn:hover { background: var(--border); }
.common-days-btn.active { background: #dcfce7; border-color: #86efac; color: #15803d; }
.hint { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }

/* Refresh indicator */
.refresh-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; margin-left: 6px; }
.refresh-dot.syncing { background: var(--accent); animation: pulse .8s ease infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
</style>
</head>
<body>

<header>
  <span class="logo">📅 Calendrier Partagé</span>
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="refreshDot" class="refresh-dot" title="Synchronisé"></span>
    <button class="btn btn-primary" onclick="copyLink()">🔗 Copier le lien</button>
  </div>
</header>

<div class="main">
  <section class="calendar-section">
    <div class="calendar-card">
      <div class="calendar-nav">
        <button class="nav-btn" onclick="changeMonth(-1)" aria-label="Mois précédent">‹</button>
        <h2 id="monthTitle"></h2>
        <button class="nav-btn" onclick="changeMonth(1)" aria-label="Mois suivant">›</button>
      </div>
      <div class="day-headers" id="dayHeaders"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <div class="legend">
      <span class="legend-item">
        <span class="legend-dot" style="background:#6366f1"></span> Occupé
      </span>
      <span class="legend-item">
        <span class="legend-dot free" style="border-color:#6366f1"></span> Disponible
      </span>
      <span class="legend-item" style="font-size:.75rem;">Cliquez un jour pour marquer</span>
    </div>
  </section>

  <aside class="sidebar">
    <div class="card">
      <div class="card-title">Mon profil</div>
      <div class="form-group">
        <label for="nameInput">Prénom</label>
        <input id="nameInput" type="text" placeholder="Votre prénom" maxlength="40" oninput="onNameChange()">
      </div>
      <div class="form-group">
        <label>Couleur</label>
        <div class="color-grid" id="colorGrid"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Participants</div>
      <div id="participantsList">
        <p class="no-participants">Aucun participant pour l'instant.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Jours communs</div>
      <p class="hint">Jours où tout le monde est disponible</p>
      <button class="common-days-btn" id="commonDaysBtn" onclick="toggleCommonDays()">
        ✨ Afficher les jours communs
      </button>
    </div>
  </aside>
</div>

<!-- Popup jour -->
<div id="dayPopup" class="day-popup" role="dialog" aria-modal="true" style="display:none;">
  <div id="popupTitle" class="popup-title"></div>
  <button class="popup-btn" onclick="markDay('busy')">🔴 Occupé</button>
  <button class="popup-btn" onclick="markDay('free')">🟢 Disponible</button>
  <button class="popup-btn danger" onclick="markDay('clear')">✕ Effacer mon marquage</button>
</div>

<!-- Bandeau d'erreur -->
<div id="errorBanner" class="error-banner" style="display:none;">
  <span aria-hidden="true">⚠️</span> <span id="errorMsg"></span>
  <button id="errorAction" class="btn btn-secondary" style="display:none;font-size:0.8rem;padding:5px 10px;margin-left:8px;"></button>
  <button class="error-close" onclick="hideError()">✕</button>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none;"></div>

<!-- Overlay de chargement -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <p>Chargement du calendrier…</p>
</div>

<script>
// ========== CONSTANTS ==========
const JSONBLOB_BASE = 'https://jsonblob.com/api/jsonBlob';

const LS = {
    userId:    'cal_user_id',
    userName:  'cal_user_name',
    userColor: 'cal_user_color',
    blobId:    'cal_blob_id'
};

const PRESET_COLORS = [
    '#ef4444','#f97316','#eab308','#22c55e',
    '#06b6d4','#6366f1','#a855f7','#ec4899',
    '#14b8a6','#84cc16','#3b82f6','#f43f5e'
];

const MONTH_NAMES = [
    'Janvier','Février','Mars','Avril','Mai','Juin',
    'Juillet','Août','Septembre','Octobre','Novembre','Décembre'
];

const DAY_HEADERS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

// ========== STATE ==========

let sharedState = { users: [], markings: {} };

let currentUser = { id: null, name: '', color: PRESET_COLORS[0] };

let viewMonth = new Date().getMonth();
let viewYear  = new Date().getFullYear();

let popupDate = null;
let showCommonDays = false;

function generateId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function loadCurrentUser() {
    const id = localStorage.getItem(LS.userId);
    if (id) {
        currentUser.id    = id;
        currentUser.name  = localStorage.getItem(LS.userName) || '';
        currentUser.color = localStorage.getItem(LS.userColor) || PRESET_COLORS[0];
    } else {
        currentUser.id = generateId();
        saveCurrentUser();
    }
}

function saveCurrentUser() {
    localStorage.setItem(LS.userId,    currentUser.id);
    localStorage.setItem(LS.userName,  currentUser.name);
    localStorage.setItem(LS.userColor, currentUser.color);
}

function formatDate(year, month1, day) {
    return `${year}-${String(month1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ========== API ==========

async function apiCreateBlob(data) {
    const res = await fetch(JSONBLOB_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`Création blob échouée : ${res.status}`);
    const location = res.headers.get('Location');
    if (!location) throw new Error('Blob créé mais Location header absent');
    return location.split('/').pop();
}

async function apiGetBlob(blobId) {
    const res = await fetch(`${JSONBLOB_BASE}/${blobId}`);
    if (res.status === 404) throw new Error('BLOB_NOT_FOUND');
    if (!res.ok) throw new Error(`Lecture blob échouée : ${res.status}`);
    return res.json();
}

async function apiPutBlob(blobId, data) {
    const res = await fetch(`${JSONBLOB_BASE}/${blobId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`Écriture blob échouée : ${res.status}`);
}

// ========== URL ==========

function getBlobIdFromUrl() {
    return new URLSearchParams(window.location.search).get('cal');
}

function setBlobIdInUrl(blobId) {
    const url = new URL(window.location.href);
    url.searchParams.set('cal', blobId);
    window.history.replaceState({}, '', url.toString());
}

function getBlobId() {
    return getBlobIdFromUrl() || localStorage.getItem(LS.blobId);
}

function saveBlobId(blobId) {
    localStorage.setItem(LS.blobId, blobId);
    setBlobIdInUrl(blobId);
}

// ========== CALENDAR ==========

function renderCalendar() {
    document.getElementById('monthTitle').textContent =
        `${MONTH_NAMES[viewMonth]} ${viewYear}`;

    document.getElementById('dayHeaders').innerHTML =
        DAY_HEADERS.map(d => `<div class="day-header">${d}</div>`).join('');

    const firstDow    = new Date(viewYear, viewMonth, 1).getDay();
    const startOffset = (firstDow + 6) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const todayStr    = formatDate(
        new Date().getFullYear(), new Date().getMonth() + 1, new Date().getDate()
    );

    const cells = [];

    for (let i = 0; i < startOffset; i++) {
        cells.push('<div class="day-cell empty"></div>');
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr  = formatDate(viewYear, viewMonth + 1, day);
        const isToday  = dateStr === todayStr;
        const isPast   = dateStr < todayStr;
        const isCommon = showCommonDays && isCommonFreeDay(dateStr);

        const dayMarkings = sharedState.markings[dateStr] || [];
        const dots = dayMarkings.map(m => {
            const user = sharedState.users.find(u => u.id === m.userId);
            if (!user) return '';
            if (!['busy', 'free'].includes(m.status)) return '';
            const safeColor = PRESET_COLORS.includes(user.color) ? user.color : PRESET_COLORS[0];
            const isFree = m.status === 'free';
            return `<div class="dot ${m.status}"
                        style="background:${isFree ? 'transparent' : safeColor};border-color:${safeColor};"
                        title="${escHtml(user.name || 'Anonyme')} : ${isFree ? 'Disponible' : 'Occupé'}">
                    </div>`;
        }).join('');

        cells.push(`
            <div class="day-cell${isToday ? ' today' : ''}${isPast ? ' past' : ''}${isCommon ? ' common-free' : ''}"
                 onclick="openDayPopup(event,'${dateStr}')">
                <div class="day-number">${day}</div>
                <div class="dots-row">${dots}</div>
            </div>
        `);
    }

    document.getElementById('calendarGrid').innerHTML = cells.join('');
}

function changeMonth(delta) {
    viewMonth += delta;
    if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0;  viewYear++; }
    renderCalendar();
}

// ========== PARTICIPANTS ==========

function renderParticipants() {
    const container = document.getElementById('participantsList');
    const users = sharedState.users;

    if (users.length === 0) {
        container.innerHTML = '<p class="no-participants">Aucun participant pour l\'instant.</p>';
        return;
    }

    container.innerHTML = users.map(user => {
        const isMe  = user.id === currentUser.id;
        const count = Object.values(sharedState.markings).reduce((n, entries) =>
            n + (entries.some(e => e.userId === user.id) ? 1 : 0), 0);
        return `
            <div class="participant${isMe ? ' me' : ''}">
                <div class="participant-color" style="background:${PRESET_COLORS.includes(user.color) ? user.color : PRESET_COLORS[0]}"></div>
                <span class="participant-name">${escHtml(user.name || 'Anonyme')}${isMe ? ' <span style="color:var(--muted);font-weight:400">(moi)</span>' : ''}</span>
                <span class="participant-count">${count} j.</span>
            </div>
        `;
    }).join('');
}

// ========== COMMON DAYS ==========

function isCommonFreeDay(dateStr) {
    const users = sharedState.users;
    if (users.length < 2) return false;
    const dayMarkings = sharedState.markings[dateStr] || [];
    return users.every(user =>
        dayMarkings.some(m => m.userId === user.id && m.status === 'free')
    );
}

function toggleCommonDays() {
    showCommonDays = !showCommonDays;
    const btn = document.getElementById('commonDaysBtn');
    if (showCommonDays) {
        btn.classList.add('active');
        btn.textContent = '✅ Masquer les jours communs';
    } else {
        btn.classList.remove('active');
        btn.textContent = '✨ Afficher les jours communs';
    }
    renderCalendar();
}

// ========== SYNC ==========
let isSaving = false;
let hasPendingSave = false;

async function syncAndSave() {
    if (isSaving) { hasPendingSave = true; return; }
    isSaving = true;
    const blobId = getBlobId();
    if (!blobId) { isSaving = false; return; }

    setSyncing(true);
    try {
        const serverState = await apiGetBlob(blobId);

        const otherUsers  = (serverState.users || []).filter(u => u.id !== currentUser.id);
        const mergedUsers = [...otherUsers, { id: currentUser.id, name: currentUser.name, color: currentUser.color }];

        const mergedMarkings = {};
        for (const [date, entries] of Object.entries(serverState.markings || {})) {
            const others = entries.filter(e => e.userId !== currentUser.id);
            if (others.length > 0) mergedMarkings[date] = others;
        }

        for (const [date, entries] of Object.entries(sharedState.markings)) {
            const mine = entries.filter(e => e.userId === currentUser.id);
            if (mine.length > 0) {
                mergedMarkings[date] = [...(mergedMarkings[date] || []), ...mine];
            }
        }

        const merged = { users: mergedUsers, markings: mergedMarkings };
        await apiPutBlob(blobId, merged);
        hasPendingSave = false;
        sharedState = merged;
        renderCalendar();
        renderParticipants();

    } catch (e) {
        hasPendingSave = true;
        showError('Synchronisation échouée. Réessai au prochain rafraîchissement.');
        console.error('syncAndSave error:', e);
    } finally {
        setSyncing(false);
        isSaving = false;
    }
}

async function refreshFromServer() {
    const blobId = getBlobId();
    if (!blobId) return;

    setSyncing(true);
    try {
        const serverState = await apiGetBlob(blobId);

        const myMarkings = {};
        for (const [date, entries] of Object.entries(sharedState.markings)) {
            const mine = entries.filter(e => e.userId === currentUser.id);
            if (mine.length > 0) myMarkings[date] = mine;
        }

        const mergedMarkings = {};
        for (const [date, entries] of Object.entries(serverState.markings || {})) {
            const others = entries.filter(e => e.userId !== currentUser.id);
            if (others.length > 0) mergedMarkings[date] = others;
        }
        for (const [date, mine] of Object.entries(myMarkings)) {
            mergedMarkings[date] = [...(mergedMarkings[date] || []), ...mine];
        }

        sharedState = { users: serverState.users || [], markings: mergedMarkings };
        renderCalendar();
        renderParticipants();
        hideError();
        if (hasPendingSave) await syncAndSave();

    } catch (e) {
        console.warn('Refresh échoué :', e.message);
    } finally {
        setSyncing(false);
    }
}

function setSyncing(syncing) {
    const dot = document.getElementById('refreshDot');
    if (syncing) dot.classList.add('syncing');
    else         dot.classList.remove('syncing');
}

// ========== MARKING ==========

function openDayPopup(event, dateStr) {
    event.stopPropagation();

    if (!currentUser.name.trim()) {
        showToast('Entrez d\'abord votre prénom dans "Mon profil" 👆');
        document.getElementById('nameInput').focus();
        return;
    }

    popupDate = dateStr;

    const [y, m, d] = dateStr.split('-').map(Number);
    const date      = new Date(y, m - 1, d);
    const dayNames  = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    document.getElementById('popupTitle').textContent =
        `${dayNames[date.getDay()]} ${d} ${MONTH_NAMES[m-1].slice(0,3).toLowerCase()}.`;

    const popup = document.getElementById('dayPopup');
    popup.style.display = 'block';

    const rect  = event.currentTarget.getBoundingClientRect();
    const popupW = 155;
    let top  = rect.bottom + 6;
    let left = rect.left + rect.width / 2 - popupW / 2;

    if (left + popupW > window.innerWidth - 8) left = window.innerWidth - popupW - 8;
    if (left < 8) left = 8;
    if (top + 130 > window.innerHeight) top = rect.top - 130;

    popup.style.top  = `${top}px`;
    popup.style.left = `${left}px`;
}

function closeDayPopup() {
    document.getElementById('dayPopup').style.display = 'none';
    popupDate = null;
}

document.addEventListener('click', e => {
    const popup = document.getElementById('dayPopup');
    if (popup.style.display !== 'none' && !popup.contains(e.target)) {
        closeDayPopup();
    }
});

async function markDay(status) {
    if (!popupDate) return;
    const dateStr = popupDate;
    closeDayPopup();

    if (!sharedState.markings[dateStr]) sharedState.markings[dateStr] = [];

    sharedState.markings[dateStr] =
        sharedState.markings[dateStr].filter(m => m.userId !== currentUser.id);

    if (status !== 'clear') {
        sharedState.markings[dateStr].push({ userId: currentUser.id, status });
    }

    if (sharedState.markings[dateStr].length === 0) {
        delete sharedState.markings[dateStr];
    }

    upsertCurrentUser();
    renderCalendar();
    renderParticipants();
    await syncAndSave();
}

function upsertCurrentUser() {
    const idx       = sharedState.users.findIndex(u => u.id === currentUser.id);
    const userEntry = { id: currentUser.id, name: currentUser.name, color: currentUser.color };
    if (idx >= 0) sharedState.users[idx] = userEntry;
    else          sharedState.users.push(userEntry);
}

// ========== PROFILE ==========
let nameChangeTimer = null;

function renderProfile() {
    document.getElementById('nameInput').value = currentUser.name;
    renderColorGrid();
}

function renderColorGrid() {
    document.getElementById('colorGrid').innerHTML = PRESET_COLORS.map(color => `
        <div class="color-swatch${currentUser.color === color ? ' selected' : ''}"
             style="background:${color}"
             onclick="selectColor('${color}')"
             title="${color}">
        </div>
    `).join('');
}

function onNameChange() {
    currentUser.name = document.getElementById('nameInput').value;
    saveCurrentUser();
    upsertCurrentUser();
    renderParticipants();
    clearTimeout(nameChangeTimer);
    nameChangeTimer = setTimeout(syncAndSave, 1500);
}

function selectColor(color) {
    currentUser.color = color;
    saveCurrentUser();
    upsertCurrentUser();
    renderColorGrid();
    renderCalendar();
    renderParticipants();
    syncAndSave();
}

// ========== POLLING ==========

let pollingInterval = null;

function startPolling() {
    if (pollingInterval) return;
    pollingInterval = setInterval(refreshFromServer, 30_000);
}

function stopPolling() {
    clearInterval(pollingInterval);
    pollingInterval = null;
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopPolling();
    else { startPolling(); refreshFromServer(); }
});

// ========== TOAST / ERROR ==========

let toastTimeout = null;

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

function showError(msg, actionLabel, actionFn) {
    document.getElementById('errorMsg').textContent = msg;
    const actionBtn = document.getElementById('errorAction');
    if (actionLabel && actionFn) {
        actionBtn.textContent = actionLabel;
        actionBtn.onclick = actionFn;
        actionBtn.style.display = 'inline-block';
    } else {
        actionBtn.style.display = 'none';
    }
    document.getElementById('errorBanner').style.display = 'flex';
}

function hideError() {
    document.getElementById('errorBanner').style.display = 'none';
    document.getElementById('errorAction').style.display = 'none';
}

async function copyLink() {
    if (!getBlobId()) {
        showToast('Calendrier non disponible — réessayez dans un instant.');
        return;
    }
    const url = window.location.href;
    try {
        await navigator.clipboard.writeText(url);
    } catch {
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
    }
    showToast('Lien copié ! Envoyez-le à vos amis 🎉');
}

// ========== INIT ==========

function showLoading(show) {
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
}

async function initBlob() {
    let blobId = getBlobId();

    if (!blobId) {
        const initialState = { users: [], markings: {} };
        blobId = await apiCreateBlob(initialState);
        saveBlobId(blobId);
        sharedState = initialState;
    } else {
        try {
            sharedState = await apiGetBlob(blobId);
            saveBlobId(blobId);
        } catch (e) {
            if (e.message === 'BLOB_NOT_FOUND') {
                showError(
                    'Calendrier introuvable (lien expiré ou invalide).',
                    'Créer un nouveau calendrier',
                    async () => {
                        hideError();
                        showLoading(true);
                        try {
                            const newId = await apiCreateBlob({ users: [], markings: {} });
                            saveBlobId(newId);
                            sharedState = { users: [], markings: {} };
                            renderCalendar();
                            renderProfile();
                            renderParticipants();
                            startPolling();
                        } catch (err) {
                            showError('Impossible de créer le calendrier. Vérifiez votre connexion.');
                            console.error(err);
                        } finally {
                            showLoading(false);
                        }
                    }
                );
                throw new Error('BLOB_NOT_FOUND_HANDLED');
            } else {
                throw e;
            }
        }
    }
}

async function init() {
    try {
        showLoading(true);
        loadCurrentUser();
        await initBlob();
        renderCalendar();
        renderProfile();
        renderParticipants();
        startPolling();
    } catch (e) {
        if (e.message === 'BLOB_NOT_FOUND_HANDLED') {
            // error banner already shown with action button, do nothing
        } else {
            showError('Impossible de joindre le serveur. Vérifiez votre connexion.');
            console.error(e);
        }
    } finally {
        showLoading(false);
    }
}

init();
</script>
